name: Release

# 推送 v* 标签（如 v1.0.1）时自动构建 APK 并发布到 GitHub Releases。
# 正式签名需要在仓库 Settings → Secrets and variables → Actions 中配置：
#   KEYSTORE_BASE64  keystore 文件的 base64
#   KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
# 未配置时使用临时 debug 签名（每次构建签名不同，用户无法覆盖升级），仅适合测试。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Configure signing
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Warn about debug signing
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        run: echo "::warning::未配置 KEYSTORE_BASE64，本次使用 debug 签名构建"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Rename artifacts
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" "dist/Iwara-${VERSION}-${abi}.apk"
          done
          ls -l dist

      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # 取 CHANGELOG.md 中「## <tag>」到下一个「## 」之间的内容
          awk -v tag="## ${GITHUB_REF_NAME}" 'index($0, tag) == 1 { f = 1; next } /^## / { if (f) exit } f' CHANGELOG.md > release_notes.md
          [ -s release_notes.md ] || echo "详见提交记录。" > release_notes.md
          cat release_notes.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          # 失败时把 gh 的错误输出写成注解，便于在 Actions 页面直接查看原因
          fail() { echo "::error title=发布 Release 失败::$(tr '\n' ' ' < gh_error.log)"; exit 1; }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # 重新运行时更新已有 Release
            gh release upload "$TAG" dist/*.apk --clobber --repo "$GITHUB_REPOSITORY" 2> gh_error.log || fail
            gh release edit "$TAG" --notes-file release_notes.md --repo "$GITHUB_REPOSITORY" 2> gh_error.log || fail
          else
            gh release create "$TAG" dist/*.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes-file release_notes.md 2> gh_error.log || fail
          fi

      - name: Upload artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v5
        with:
          name: apk
          path: dist/*.apk
